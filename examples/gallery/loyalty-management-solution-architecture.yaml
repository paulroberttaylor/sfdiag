# Recreation of the official Salesforce Architects "Loyalty management solution architecture" diagram
title: Loyalty management solution architecture
description: This diagram details the products and technology directly involved in a  loyalty management solution.
keyRows: 1
key:
  - { label: Streams, icon: slds:data_transforms/indigo }
  - { label: "Single Source\nof Truth", icon: slds:user/indigo }
  - { label: Segments, icon: slds:target/indigo }
  - { label: "Interaction\nStudio", icon: slds:people_score/orange }
  - { label: Social Studio, icon: slds:contact/orange }
  - { label: "Customer 360\nAudiences", icon: slds:emoji_excellent/orange }
nodes:
  - id: top
    frame: none
    layout: row
    align: start
    children:
      - id: commerce
        title: Commerce
        icon: slds:cart/green
        iconStyle: plain
        attributes: [Orders, Offers, Pricing, Catalog]
        footer: Headless Commerce
      # Tableau sits below the Commerce/Salesforce label: centre it in a tall invisible column.
      - id: tableau-col
        frame: none
        layout: column
        height: 400
        justify: center
        children:
          - id: tableau
            title: Tableau
            icon: tableau
            iconStyle: plain
      - id: salesforce
        title: Salesforce
        icon: salesforce
        iconStyle: plain
        layout: grid
        columns: 2
        children:
          - id: loyalty
            title: Loyalty
            icon: slds:contact/navy
            attributes: [Program, Points, Member]
          - id: sales
            title: Sales
            icon: sales-cloud
            attributes: [Accounts, Contacts, Orders, Reports & Dashboards]
          - id: service
            title: Service
            icon: service-cloud
            attributes: [Contacts, Cases, Offers]
          - id: cdp
            title: Customer Data Platform
            footerIcons: [slds:data_transforms/indigo, slds:user/indigo, slds:target/indigo]
      - id: marketing
        title: Marketing
        icon: slds:search/orange
        attributes: [Journeys, Campaigns, Personalized Comms, Interaction Streams, Affinity & Intent]
        footer: Personalized Communications
        footerIcons: [slds:people_score/orange, slds:contact/orange, slds:emoji_excellent/orange]
  - id: mulesoft
    title: Mulesoft
    icon: mulesoft
    iconStyle: plain
  - id: bottom
    frame: none
    layout: row
    children:
      - id: industry
        title: Industry Data Sources
        grow: 3
        icon: slds:company/purple
        footerIcons:
          - slds:currency/indigo
          - slds:company/indigo
          - slds:broadcast/indigo
          - slds:store/indigo
          - slds:education/indigo
          - slds:light_bulb/indigo
          - slds:lock/indigo
          - slds:home/indigo
          - slds:file/indigo
          - slds:heart/indigo
          - slds:settings/indigo
          - slds:video/indigo
          - slds:world/indigo
          - slds:user/indigo
          - slds:retail_execution/indigo
          - slds:plane/indigo
      - id: suppliers
        title: Supplier & Partner Ecosystem
        attributes: ["Leads, Forecasts, Inventory, POS, etc.", External context]
connections:
  - { from: salesforce, to: commerce, arrow: both, label: "Order on behalf\nOrder history\nSeamless identity\nLoyalty status, points", fromSide: left, toSide: right }
  - { from: marketing, to: salesforce, label: "Preferences\nclicks, email opens" }
  - { from: marketing, to: salesforce, arrow: both, label: "Marketing Cloud\nConnect" }
  - { from: marketing, to: salesforce, arrow: both, label: "Distributed\nMarketing" }
  - { from: marketing, to: salesforce, arrow: both, label: "Social Customer\nService" }
  - { from: commerce, to: mulesoft, arrow: both, label: "Abandoned cart\nCoupon redemption\nPersonalized marketing\nRecommendations\nTransactional emails" }
  - { from: commerce, to: marketing, arrow: both, fromSide: bottom, toSide: bottom }
  - { from: tableau, to: mulesoft, arrow: both }
  - { from: marketing, to: mulesoft, arrow: both }
