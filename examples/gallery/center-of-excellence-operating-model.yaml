# Recreation of the official "Center of Excellence Operating Model" (Salesforce Architects diagram gallery)
title: Center of Excellence Operating Model
description: >-
  This diagram details how stakeholders work within and across a Center of
  Excellence (CoE), and how the CoE bridges executive stakeholders and IT.
keyLabels:
  slds:apex/indigo: Development
  slds:slider/navy: Admin
  slds:phone_portrait/indigo: Apps
  slds:insert_tag_field/indigo: Release Mgmt
nodes:
  - id: steering
    title: Executive Steering Committee
    attributes: [Budgets and approvals]
    height: 88
  - id: coe
    title: Center of Excellence
    justify: space-between
    attributes:
      - Functional Leadership
      - "    Business outcomes"
      - "    Change management"
      - "    Training & development"
      - Technical Leadership
      - "    Architectural review"
      - "    Release management"
      - "    Data stewardship"
    children:
      - id: team1
        title: App Team 1
        icon: slds:hierarchy/navy
        footer: Delivery Team Capabilities
        footerIcons: [slds:apex/indigo, slds:slider/navy, slds:phone_portrait/indigo, slds:insert_tag_field/indigo]
      - id: team2
        title: App Team 2
        icon: slds:hierarchy/navy
        footer: Delivery Team Capabilities
        footerIcons: [slds:apex/indigo, slds:slider/navy, slds:phone_portrait/indigo, slds:insert_tag_field/indigo]
      - id: teamn
        title: App Team n
        icon: slds:hierarchy/navy
        footer: Delivery Team Capabilities
        footerIcons: [slds:apex/indigo, slds:slider/navy, slds:phone_portrait/indigo, slds:insert_tag_field/indigo]
  - id: it
    title: Information Technology (IT)
    justify: center
    children:
      - { id: governance, title: Data Governance, icon: slds:database/indigo }
      - { id: security, title: Security, icon: slds:locker_service_console/indigo }
      - { id: delivery, title: Service Delivery, icon: slds:success/navy }
      - { id: auth, title: Authentication, icon: slds:lock/navy }
