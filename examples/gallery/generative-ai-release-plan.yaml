key:
  - { label: Requirements Gathering, icon: "slds:edit/#321D71" }
  - { label: Ethical Review, icon: "slds:user/#481A54" }
  - { label: Executive Approval, icon: "slds:shield/#321D71" }
  - { label: Model Selection, icon: "slds:data_model/#321D71" }
  - { label: Prompt Engineering, icon: "slds:einstein/#321D71" }
  - { label: Data Prep, icon: "slds:database/#321D71" }
  - { label: Quality Review, icon: "slds:search/#321D71" }
  - { label: Response Feedback, icon: "slds:groups/#321D71" }
