# Recreation of the official "Technology System Roadmap" (architect.salesforce.com/diagrams, system-roadmap)
title: Technology System Roadmap
description: >-
  This roadmap shows an expanded view of the systems that will be implemented over the
  next 12 months to assist business and technical stakeholders with planning and budgeting.
keyRows: 3
key:
  - { label: Mobile, icon: "slds:phone_portrait/#321D71" }
  - { label: Chatbots, icon: "slds:robot/#321D71" }
  - { label: Case Management, icon: "slds:custom_apps/#032D60" }
  - { label: CMS, icon: "slds:cms/#032D60" }
  - { label: Workflow, icon: "slds:flow_alt/#321D71" }
  - { label: Personalization, icon: "slds:groups/#321D71" }
  - { label: Pricing Engine, icon: "slds:settings/#481A54" }
  - { label: Lead-to-Cash, icon: "slds:shopping_bag/#481A54" }
  - { label: Platform Integration, icon: "slds:link/#032D60" }
timeline:
  shade: columns
  periodWidths: [300, 350, 360, 310]
  periods:
    - "Q1: January 1 - March 30"
    - "Q2: April 1 - June 30"
    - "Q3: July 1 - September 30"
    - "Q4: October 1 - December 31"
  lanes:
    - title: Sales
      items:
        - id: sales-cloud
          title: Sales Cloud
          from: 0.22
          to: 1.88
          attributes: ["Start Date: January 15", "End Date: June 20", "Dependencies: None"]
          footerIcons: ["slds:flow_alt/#321D71", "slds:shopping_bag/#481A54"]
        - id: cpq
          title: CPQ
          from: 1.27
          to: 2.71
          attributes: ["Start Date: April 15", "End Date: August 30", "Dependencies: None"]
          footerIcons: ["slds:settings/#481A54"]
    - title: Service
      items:
        - id: service-cloud
          title: Service Cloud
          from: 0.57
          to: 2.5
          attributes: ["Start Date: March 4", "End Date: August 15", "Dependencies: None"]
          footerIcons: ["slds:robot/#321D71", "slds:custom_apps/#032D60", "slds:cms/#032D60", "slds:flow_alt/#321D71"]
        - id: field-service
          title: Field Service Lightning
          from: 1.49
          to: 3.69
          attributes: ["Start Date: June 15", "End Date: October 22", "Dependencies: None"]
          footerIcons: ["slds:phone_portrait/#321D71"]
    - title: Engagement
      items:
        - id: experience-cloud
          title: Experience Cloud
          from: 0.51
          to: 1.76
          attributes: ["Start Date: January 15", "End Date: June 10", "Dependencies: None"]
          footerIcons: ["slds:cms/#032D60", "slds:phone_portrait/#321D71", "slds:groups/#321D71"]
    - title: Analytics
      items:
        - id: tableau
          title: Tableau
          from: 2.59
          to: 3.79
          attributes: ["Start Date: August 22", "End Date: December 15", "Dependencies: None"]
          footerIcons: ["slds:link/#032D60"]
